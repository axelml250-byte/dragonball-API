<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Dragon Ball API - FCA UNAM</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between">

    <header class="bg-gray-800 border-b border-yellow-500 p-5 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-extrabold text-yellow-500 tracking-wider">☄️ UNIVERSO DRAGON BALL</h1>
            <p class="text-sm text-gray-400 bg-gray-700 px-3 py-1 rounded border border-gray-600">Informática VI - Práctica Final</p>
        </div>
    </header>

    <main class="container mx-auto p-4 flex-grow">
        <div id="loader" class="text-center my-20">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-yellow-500 border-t-transparent"></div>
            <p class="text-gray-400 mt-3 text-lg">Cargando guerreros...</p>
        </div>

        <div id="characters-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 hidden"></div>
    </main>

    <section class="bg-gray-800 border-t border-gray-700 py-4 shadow-inner">
        <div class="container mx-auto flex justify-center items-center gap-4">
            <button id="btn-prev" class="bg-yellow-600 hover:bg-yellow-500 disabled:bg-gray-700 disabled:text-gray-500 text-gray-900 font-bold px-4 py-2 rounded shadow">
                ◀ Anterior
            </button>
            <span id="page-info" class="text-yellow-500 font-bold bg-gray-900 px-4 py-2 rounded border border-gray-700">
                Página 1 de 6
            </span>
            <button id="btn-next" class="bg-yellow-600 hover:bg-yellow-500 disabled:bg-gray-700 disabled:text-gray-500 text-gray-900 font-bold px-4 py-2 rounded shadow">
                Siguiente ▶
            </button>
        </div>
    </section>

    <footer class="bg-gray-950 p-3 text-center text-xs text-gray-500 border-t border-gray-900">
        © 2026 Facultad de Contaduría y Administración - UNAM.
    </footer>

    <script>
        const grid = document.getElementById('characters-grid');
        const loader = document.getElementById('loader');

        async function cargarPersonajes() {
            const url = `https://dragonball-api.com/api/characters?page=1&limit=10`;
            try {
                const respuesta = await fetch(url);
                const datos = await respuesta.json();
                mostrarPersonajes(datos.items);
            } catch (error) {
                console.error("Error al recuperar los datos:", error);
            } finally {
                loader.classList.add('hidden');
            }
        }

        function mostrarPersonajes(personajes) {
            grid.innerHTML = '';
            personajes.forEach(personaje => {
                const card = document.createElement('div');
                card.className = "bg-gray-800 border border-gray-700 rounded-lg overflow-hidden shadow-lg flex flex-col justify-between p-4";
                card.innerHTML = `
                    <div class="flex justify-center items-center h-64 overflow-hidden mb-4">
                        <img src="${personaje.image}" alt="${personaje.name}" class="h-full object-contain">
                    </div>
                    <div>
                        <h3 class="text-xl font-extrabold text-yellow-400 mb-1">${personaje.name}</h3>
                        <p class="text-xs text-gray-400 mb-3"><span class="text-yellow-600">KI Base:</span> ${personaje.ki}</p>
                        <p class="text-gray-300 text-xs text-justify line-clamp-4">${personaje.description || 'Sin descripción.'}</p>
                    </div>`;
                grid.appendChild(card);
            });
            grid.classList.remove('hidden');
        }

        cargarPersonajes();
    </script>
</body>
</html>
